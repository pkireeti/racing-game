<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Racing - Phase 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div class="title">3D RACING</div>
    <div class="info">
      <span>Speed: <b id="speed">0</b> km/h</span>
      <span>Camera: <b id="cameraMode">Chase</b></span>
    </div>
    <div class="controls">
      W / ↑ Accelerate &nbsp; | &nbsp; S / ↓ Brake &nbsp; | &nbsp;
      A,D / ←,→ Steer &nbsp; | &nbsp; C Camera
    </div>
  </div>
  <div id="loading">Loading 3D Racing...</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
